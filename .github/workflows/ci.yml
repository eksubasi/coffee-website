name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: backend-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend

    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      SECRET_KEY: ci-only-not-for-production
      DATABASE_URL: postgresql://brewnook:ci-password@localhost:5432/brewnook

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: brewnook
          POSTGRES_USER: brewnook
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brewnook -d brewnook"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Ruff
        run: python -m ruff check .

      - name: Check Django configuration
        run: python manage.py check

      - name: Check migration consistency
        run: python manage.py makemigrations --check --dry-run

      - name: Run backend tests
        run: python -m pytest -q

  frontend:
    name: frontend-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check TypeScript and build frontend
        run: npm run build